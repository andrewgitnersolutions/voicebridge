<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceBridge — Listen to Voice Note</title>
  <link rel="stylesheet" href="../content/content.css">
  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      font-family: var(--vb-font-family);
    }
    .player-card {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 20px;
      max-width: 560px;
      width: 100%;
      padding: 36px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 16px;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
    }
    .badge-status {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1e40af;
    }
    .audio-wrapper {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .audio-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #475569;
    }
    audio {
      width: 100%;
      border-radius: 8px;
      outline: none;
    }
    .btn-download {
      min-height: 48px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s;
      text-decoration: none;
    }
    .btn-download:hover {
      background-color: #1d4ed8;
      transform: translateY(-1px);
    }
    .note-info {
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="player-card">
    <div class="card-header">
      <div class="brand-title">
        <span>🎙️</span>
        <span>VoiceBridge Note</span>
      </div>
      <span class="badge-status" id="badge-mode">Audio Recording</span>
    </div>

    <div class="audio-wrapper">
      <div class="audio-info">
        <strong id="file-name">VoiceBridge_Recording.webm</strong>
        <span id="recording-date">Ready to Play</span>
      </div>
      <audio id="audio-player" controls autoplay style="width: 100%;"></audio>
    </div>

    <a href="#" class="btn-download" id="btn-download-audio" download="VoiceBridge_Note.webm">
      <span>⬇️</span>
      <span>Download Voice File (.webm)</span>
    </a>

    <div class="note-info">
      🔒 <strong>FERPA & COPPA Compliant</strong>: Built for K-12 classrooms and Special Education accommodations.
    </div>
  </div>

  <script src="listen.js"></script>
</body>
</html>
