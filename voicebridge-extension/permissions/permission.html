<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceBridge — Enable Microphone Access</title>
  <link rel="stylesheet" href="../content/content.css">
  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      font-family: var(--vb-font-family);
    }
    .setup-card {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      padding: 36px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .mic-icon-large {
      font-size: 56px;
      background: #eff6ff;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #bfdbfe;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1e293b;
      margin: 0;
    }
    p {
      color: #475569;
      font-size: 15px;
      line-height: 1.5;
      margin: 0;
    }
    .grant-btn {
      width: 100%;
      min-height: 52px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
      transition: all 0.15s ease-in-out;
    }
    .grant-btn:hover {
      background-color: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
    }
    .status-box {
      font-size: 14px;
      font-weight: 600;
      padding: 12px 16px;
      border-radius: 10px;
      width: 100%;
      box-sizing: border-box;
      display: none;
    }
    .status-success {
      display: block;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .status-error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .ferpa-badge {
      font-size: 12px;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="setup-card">
    <div class="mic-icon-large" id="icon-display">🎙️</div>
    <h1 id="setup-title">Enable Microphone for VoiceBridge</h1>
    <p id="setup-desc">
      To record voice responses directly in Google Classroom & Docs, Chrome needs one-time permission to access your microphone.
    </p>

    <div id="status-msg" class="status-box"></div>

    <button class="grant-btn" id="btn-grant-permission">
      <span>🎙️</span>
      <span>Allow Microphone Access</span>
    </button>

    <div class="ferpa-badge">
      <span>🔒</span>
      <span>FERPA Compliant: Your audio is saved only to your student Google Drive.</span>
    </div>
  </div>

  <script src="permission.js"></script>
</body>
</html>
